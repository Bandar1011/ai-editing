[project]
name = "ai-editing"
version = "0.1.0"
description = "A local, transcript-first video editing and versioned review workspace."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "pillow>=11",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
